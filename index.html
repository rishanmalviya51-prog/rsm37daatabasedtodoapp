<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina Habits</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              bone: {
                50: '#FDFCF8',
                100: '#F7F5F0',
                200: '#EBE8DF',
                300: '#D8D4C9',
                800: '#5C5850',
                900: '#2E2C28',
              },
              solar: {
                start: '#FDE68A', // Amber 200
                mid: '#FED7AA',   // Orange 200
                end: '#FECDD3',   // Rose 200
              },
              neon: {
                primary: '#00F0FF',   // Cyber Cyan
                secondary: '#7000FF', // Electric Purple
                accent: '#FF003C',    // Neon Red
                surface: '#13131F',   // Deep Tech Blue/Black
                dark: '#050508',      // Almost Void
              }
            },
            boxShadow: {
              'neon': '0 0 5px theme("colors.neon.primary"), 0 0 20px theme("colors.neon.primary")',
              'neon-hover': '0 0 10px theme("colors.neon.primary"), 0 0 40px theme("colors.neon.primary")',
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        /* Smooth scrolling */
        scroll-behavior: smooth;
      }
      /* Custom Scrollbar for hidden aesthetics */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #334155;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.1/",
    "react": "https://esm.sh/react@^19.2.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.1/",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.560.0",
    "recharts": "https://esm.sh/recharts@^3.5.1",
    "simplex-noise": "https://esm.sh/simplex-noise@4.0.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-bone-50 dark:bg-neon-dark text-bone-900 dark:text-gray-100 transition-colors duration-500 antialiased overflow-x-hidden selection:bg-neon-primary selection:text-black">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
